<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{heading}}</title>
    <style>
      @media only screen and (max-width: 600px) {
        .container {
          width: 100% !important;
        }
        .content {
          padding: 18px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: Arial, Helvetica, sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f1f5f9; padding: 24px 0">
      <tr>
        <td align="center">
          <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" style="width: 560px; max-width: 100%; background-color: #ffffff; border-radius: 8px; overflow: hidden">
            <tr>
              <td style="background-color: #1f3864; padding: 20px 24px">
                <span style="color: #ffffff; font-size: 18px; font-weight: bold">{{tenantName}}</span>
              </td>
            </tr>
            <tr>
              <td class="content" style="padding: 24px">
                <h1 style="margin: 0 0 12px; font-size: 18px; color: #0f172a">{{heading}}</h1>
                {{bodyHtml}}
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 24px; background-color: #f8fafc; border-top: 1px solid #e2e8f0">
                <p style="margin: 0; font-size: 12px; color: #94a3b8">Message envoyé depuis QMS SaaS au nom de {{tenantName}}.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
