<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAPA en retard</title>
    <style>
      @media only screen and (max-width: 480px) {
        .container {
          width: 100% !important;
        }
        .content {
          padding: 20px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: Arial, Helvetica, sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f1f5f9; padding: 24px 0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            class="container"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="width: 480px; max-width: 100%; background-color: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td style="background-color: #1f3864; padding: 20px 24px">
                <span style="color: #ffffff; font-size: 18px; font-weight: bold">QMS SaaS</span>
              </td>
            </tr>
            <tr>
              <td class="content" style="padding: 24px">
                <span
                  style="display: inline-block; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px; background-color: #fee2e2; color: #b91c1c; font-size: 12px; font-weight: bold"
                  >En retard</span
                >
                <h1 style="margin: 0 0 12px; font-size: 18px; color: #0f172a">Une CAPA a dépassé son échéance</h1>
                <p style="margin: 0 0 16px; font-size: 14px; color: #334155; line-height: 1.5">
                  Bonjour {{userName}},<br /><br />
                  La CAPA <strong>{{capaNumber}} — {{capaTitle}}</strong> devait être clôturée le
                  <strong>{{dueDate}}</strong> et n'a pas encore été traitée.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius: 6px; background-color: #1f3864">
                      <a
                        href="{{capaUrl}}"
                        style="display: inline-block; padding: 12px 20px; color: #ffffff; font-size: 14px; font-weight: bold; text-decoration: none"
                        >Voir la CAPA</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 24px; background-color: #f8fafc; border-top: 1px solid #e2e8f0">
                <p style="margin: 0; font-size: 12px; color: #94a3b8">
                  QMS SaaS — plateforme de gestion documentaire et qualité.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
